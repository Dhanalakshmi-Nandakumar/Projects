<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Our Story ❤️</title>

    <link rel="stylesheet" href="css/review.css">

</head>

<body>
    <div class="floating-hearts">
    <span>♥</span>
    <span>♡</span>
    <span>♥</span>
    <span>♡</span>
    <span>♥</span>
    <span>♡</span>
    <span>♥</span>
    <span>♡</span>
</div>

    <main class="review-page">

        <div class="review-container">

            <p class="progress">
                01 / 04
            </p>

            <p class="eyebrow">
                TWO YEARS • JUST US
            </p>

            <h1>
                Okay...
                <span>let's talk about us.</span> ❤️
            </h1>

            <p class="subtitle">
                No perfect answers.
                Just tell me what you really feel.
            </p>


            <!-- Question 1 -->

            <section class="question">

                <label for="relationshipMeaning">
                    After two years together,
                    what does our relationship
                    mean to you?
                </label>

                <textarea
                    id="relationshipMeaning"
                    placeholder="Tell me what's in your heart..."
                ></textarea>

            </section>


            <!-- Question 2 -->

            <section class="question">

                <label>
                    How loved do you feel by me?
                </label>

               <div class="love-rating">

    <button type="button" data-rating="1">❤️</button>
    <button type="button" data-rating="2">❤️❤️</button>
    <button type="button" data-rating="3">❤️❤️❤️</button>
    <button type="button" data-rating="4">❤️❤️❤️❤️</button>
    <button type="button" data-rating="5">❤️❤️❤️❤️❤️</button>

</div>

            </section>


            <!-- Question 3 -->

            <section class="question">

                <label for="favoriteThing">
                    What's one thing you absolutely
                    love about us?
                </label>

                <textarea
                    id="favoriteThing"
                    placeholder="Something small or something big..."
                ></textarea>

            </section>


            <!-- Question 4 -->

            <section class="question">

                <label for="improvement">
                    What's one thing you'd like
                    us to improve?
                </label>

                <textarea
                    id="improvement"
                    placeholder="You can be honest. I promise I'll listen. 🫶"
                ></textarea>

            </section>


            

           <button class="next-btn"
        onclick="submitReview()">

    Continue
    <span>→</span>

</button>

<p id="successMessage" class="success-message"></p>


        </div>

    </main>


    

       <script src="js/app.js"></script>


</body>

</html>
